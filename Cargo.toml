[package]
name = "auxloclaw"
version = "0.7.7"
edition = "2021"
authors = ["Auxlo.xyz <hello@auxlo.xyz>"]
description = "Ultra-high-performance AI agent framework - beats Hermes and Nanobot"
license = "MIT"
repository = "https://github.com/Auxlo-xyz/auxloclaw"

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }.tar.gz"
pkg-fmt = "bin"
bin-dir = "{ bin }{ binary-ext }"

[dependencies]
futures = "0.3"
libc = "0.2"
# Async runtime
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
pin-project = "1"

# HTTP & WebSocket
axum = { version = "0.7", features = ["ws", "macros"] }
axum-extra = { version = "0.9", features = ["typed-header"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace", "fs"] }
hyper = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls", "blocking", "http2"], default-features = false }
reqwest-eventsource = "0.6"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"

# Database & Memory
rusqlite = { version = "0.28", features = ["bundled"] }

# CLI & Config
clap = { version = "4", features = ["derive", "env"] }
dotenvy = "0.15"

# Logging & Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Utilities
thiserror = "1"
anyhow = "1"
once_cell = "1"
parking_lot = "0.12"
dashmap = "5"
lru = "0.12"
arc-swap = "1"
bytes = "1"
tokio-stream = "0.1"
walkdir = "2"
dirs = "5"
dialoguer = { version = "0.11", features = ["history"] }
sysinfo = "0.30"
uuid = "1"

# Crypto & Security
sha2 = "0.10"
base64 = "0.22"
aes-gcm = "0.10"
hostname = "0.4"

# Time
chrono = { version = "0.4", features = ["serde"] }
tokio-cron-scheduler = "0.10"

# Parallel processing
rayon = "1"

# Telegram
teloxide = { version = "0.12", features = ["rustls", "webhooks-axum", "macros"], default-features = false }

# Discord (simplified - stub for now)
serenity = { version = "0.12", features = ["client", "gateway", "model", "standard_framework"] }

# Utilities
shellexpand = "1"
sync_wrapper = "0.1"
regex = "1.10"

[dev-dependencies]
tokio-test = "0.4"
criterion = "0.5"

[[bin]]
name = "auxloclaw"
path = "src/main.rs"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3

